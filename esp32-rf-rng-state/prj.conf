# RF-TRNG Benchmark - Base Configuration
# This is the RF-DISABLED (pseudo-random) baseline.
# Wi-Fi overlay (overlay/wifi.conf) adds networking for conditions 2-4.

# Core System
CONFIG_NEWLIB_LIBC=y
CONFIG_POSIX_API=y

# Memory - lightweight benchmark, no TLS stack
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=32768

# Debugging / Output
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=2
CONFIG_PRINTK=y
CONFIG_EARLY_CONSOLE=y

# Hardware
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_CONSOLE=y
CONFIG_GPIO=y

# Entropy - stock ESP32 TRNG driver (no BLAKE2s pool)
CONFIG_ENTROPY_GENERATOR=y

# Heap statistics for memory monitoring
CONFIG_SYS_HEAP_RUNTIME_STATS=y

# Disable unused subsystems to save DRAM
CONFIG_SHELL=n
CONFIG_PM=n
CONFIG_SMP=n
