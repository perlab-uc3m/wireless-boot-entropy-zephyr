# RF-TRNG Benchmark - Wi-Fi Overlay
# Applied on top of prj.conf for conditions 2 (wifi_idle), 3 (wifi_scan),
# and 4 (wifi_traffic).
#
# This overlay enables the ESP32 Wi-Fi driver, which activates the RF
# subsystem and changes the TRNG from pseudo-random to true-random mode.

# Networking stack
CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_TCP=n
CONFIG_NET_DHCPV4=y

# Network management
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_L2_ETHERNET_MGMT=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y

# Wi-Fi
CONFIG_WIFI=y
CONFIG_WIFI_ESP32=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_ESP32_WIFI_STA_AUTO_DHCPV4=y
CONFIG_ESP32_WIFI_STA_RECONNECT=y
CONFIG_ESP32_WIFI_STA_SCAN_ALL=y

# mbedTLS - required by ESP32 Wi-Fi driver for WPA2 crypto primitives
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_BUILTIN=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=4096
CONFIG_MBEDTLS_USER_CONFIG_ENABLE=y
CONFIG_MBEDTLS_USER_CONFIG_FILE="config-mbedtls-wifi.h"

# Disable TLS/DTLS protocol - we only need raw crypto for WPA2
CONFIG_MBEDTLS_TLS_VERSION_1_2=n
CONFIG_MBEDTLS_DTLS=n

# Disable key exchanges - not needed for WPA2-Personal
CONFIG_MBEDTLS_KEY_EXCHANGE_ALL_ENABLED=n
CONFIG_MBEDTLS_KEY_EXCHANGE_PSK_ENABLED=n
CONFIG_MBEDTLS_KEY_EXCHANGE_DHE_PSK_ENABLED=n
CONFIG_MBEDTLS_KEY_EXCHANGE_RSA_PSK_ENABLED=n
CONFIG_MBEDTLS_KEY_EXCHANGE_RSA_ENABLED=n
CONFIG_MBEDTLS_KEY_EXCHANGE_DHE_RSA_ENABLED=n
CONFIG_MBEDTLS_KEY_EXCHANGE_ECJPAKE_ENABLED=n

# Disable extras not needed for Wi-Fi
CONFIG_MBEDTLS_PEM_CERTIFICATE_FORMAT=n
CONFIG_MBEDTLS_SERVER_NAME_INDICATION=n
CONFIG_MBEDTLS_SSL_EXTENDED_MASTER_SECRET=n
CONFIG_MBEDTLS_SSL_DTLS_CONNECTION_ID=n
CONFIG_MBEDTLS_GENPRIME_ENABLED=n
CONFIG_MBEDTLS_DEBUG=n

# ECC prerequisite for Wi-Fi driver
CONFIG_MBEDTLS_ECP_DP_SECP256R1_ENABLED=y

# Increase heap for networking stack
CONFIG_HEAP_MEM_POOL_SIZE=49152
CONFIG_MAIN_STACK_SIZE=12288
