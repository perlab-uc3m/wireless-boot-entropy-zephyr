# RF-Actuated Boot Entropy

CONFIG_NEWLIB_LIBC=y
CONFIG_POSIX_API=y

CONFIG_MAIN_STACK_SIZE=12288
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=57344

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=2
CONFIG_PRINTK=y
CONFIG_EARLY_CONSOLE=y

CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_CONSOLE=y
CONFIG_GPIO=y

# Stock ESP32 entropy driver. This artifact does not use the BLAKE2s pool.
CONFIG_ENTROPY_GENERATOR=y

CONFIG_SYS_HEAP_RUNTIME_STATS=y
CONFIG_SHELL=n
CONFIG_PM=n
CONFIG_SMP=n

